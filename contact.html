<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact — ethan moon.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar__brand">ethan moon.</div>
    <nav class="sidebar__nav">
      <a href="index.html" class="sidebar__nav-link">about</a>
      <a href="works.html" class="sidebar__nav-link">works</a>
      <a href="contact.html" class="sidebar__nav-link sidebar__nav-link--active" aria-current="page">
        contact
        <svg class="squiggle" viewBox="0 0 60 10" aria-hidden="true">
          <path d="M1,6 Q7,1 13,6 T25,6 T37,6 T49,6 T60,5"/>
        </svg>
      </a>
    </nav>
  </aside>

  <main class="content">
    <h1 class="sr-only">contact — ethan moon.</h1>

    <div class="contact-layout">
      <form class="letter" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="stamp">
          <svg width="38" height="28" viewBox="0 0 38 28" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <rect x="1.5" y="1.5" width="35" height="25" rx="3"/>
            <path d="M2 3 L19 16 L36 3"/>
          </svg>
        </div>

        <h2>send me a letter!</h2>

        <div class="row">
          <label for="name">from:</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="row">
          <label for="email">email:</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="message-label"><label for="message">your message:</label></div>
        <textarea id="message" name="message" required></textarea>

        <button class="send" type="submit">send it!</button>
      </form>

      <div class="contact-sticky">
        <svg class="sticky-note" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="sticky-sketch" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
            </filter>
          </defs>

          <g transform="rotate(8 170 170)">
            <g filter="url(#sticky-sketch)" stroke="#1a1a1a" stroke-linejoin="round">
              <path d="M30 30 H310 V262 L262 310 H30 Z" fill="#fff8b8" stroke-width="2.4"/>
              <path d="M310 262 L262 310 C270 288 288 270 310 262 Z" fill="#f2e392" stroke-width="2"/>
              <path d="M34 35 H306 V260 L259 306 H34 Z" fill="none" stroke-width="1.1"/>
            </g>

            <text x="170" y="92" text-anchor="middle" font-size="32" font-weight="700">find me here!</text>

            <a href="https://www.linkedin.com/in/ethanmoon17/" target="_blank" rel="noopener">
              <title>my linkedin</title>
              <g class="sticky-note__link">
                <rect x="54" y="138" width="72" height="88" fill="transparent" stroke="none"/>
                <g filter="url(#sticky-sketch)">
                  <rect x="68" y="146" width="44" height="44" rx="10" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
                </g>
                <text x="90" y="180" text-anchor="middle" font-size="30" font-weight="700">in</text>
                <text x="90" y="214" text-anchor="middle" font-size="21">linkedin</text>
              </g>
            </a>

            <a href="https://github.com/ethanhmoon" target="_blank" rel="noopener">
              <title>my github</title>
              <g class="sticky-note__link">
                <rect x="134" y="138" width="72" height="88" fill="transparent" stroke="none"/>
                <g filter="url(#sticky-sketch)" transform="translate(170 170)">
                  <path d="M-21 2 C-21 -7 -19 -11 -15 -14 L-19 -22 L-9 -17 C-3 -20 3 -20 9 -17 L19 -22 L15 -14 C19 -11 21 -7 21 2 C21 12 12 19 0 19 C-12 19 -21 12 -21 2 Z"
                        fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"/>
                  <circle cx="-8" cy="-1" r="2.3" fill="#1a1a1a"/>
                  <circle cx="8" cy="-1" r="2.3" fill="#1a1a1a"/>
                </g>
                <text x="170" y="214" text-anchor="middle" font-size="21">github</text>
              </g>
            </a>

            <a href="resume.pdf" download>
              <title>download my resume</title>
              <g class="sticky-note__link">
                <rect x="214" y="138" width="72" height="88" fill="transparent" stroke="none"/>
                <g filter="url(#sticky-sketch)" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M233 146 H257 L267 156 V190 H233 Z"/>
                  <path d="M257 146 V156 H267"/>
                  <line x1="240" y1="166" x2="260" y2="166"/>
                  <line x1="240" y1="173" x2="260" y2="173"/>
                  <line x1="240" y1="180" x2="253" y2="180"/>
                </g>
                <text x="250" y="214" text-anchor="middle" font-size="21">resume</text>
              </g>
            </a>
          </g>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
